name: Fetch Bills

on:
  schedule:
    - cron: '0 11 * * *'  # Daily at 6:00 AM EST (11:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-bills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch bills from Congress.gov API
        run: node scripts/fetch-bills.mjs
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bills/ data/meta/
          if git diff --staged --quiet; then
            echo "No bill data changes detected."
          else
            git commit -m "chore: update bills data [$(date -u +%Y-%m-%d)]"
            git pull origin main --rebase
            git push origin main
          fi
