name: Fetch Bills Data

on:
  schedule:
    - cron: '0 11 * * 1,4'  # Monday and Thursday at 6AM EST (11:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

# Data runs all push to main, so let them queue instead of racing.
concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch-bills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch bills data
        run: node scripts/fetch-bills.mjs
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts/commit-data.sh "chore: update bills data [$(date -u +%Y-%m-%d)]" data/bills/ data/meta/
