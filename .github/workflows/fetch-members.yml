name: Fetch Congress Data

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly, Sunday at 2am UTC
  workflow_dispatch:

permissions:
  contents: write

# Data runs all push to main, so let them queue instead of racing.
concurrency:
  group: fetch-data
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sequential on one Congress.gov key so members/bills/committees do not
      # burst ~50 concurrent sockets. Votes and finances use other hosts.
      - name: Fetch members
        run: node scripts/fetch-members.mjs
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      - name: Fetch bills
        run: node scripts/fetch-bills.mjs
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      - name: Fetch committees
        run: node scripts/fetch-committees.mjs
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      - name: Fetch votes
        run: node scripts/fetch-votes.mjs

      - name: Fetch finances
        run: node scripts/fetch-finances.mjs

      # Charts are precomputed: the site is a static build and Yahoo sends no
      # CORS headers, so the browser cannot fetch price history itself.
      - name: Cache stock prices
        run: node scripts/fetch-stock-prices.mjs
        continue-on-error: true

      - name: Enrich trade timing
        run: node scripts/enrich-trade-timing.mjs
        continue-on-error: true

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts/commit-data.sh "chore: update congress data [$(date -u +%Y-%m-%d)]" data/
