name: Fetch Congress Data

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly, Sunday at 2am UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Phase 1: Independent data sources run in parallel (background processes)
      - name: "Fetch members, bills, committees (parallel)"
        run: |
          node scripts/fetch-members.mjs &
          PID_MEMBERS=$!
          node scripts/fetch-bills.mjs &
          PID_BILLS=$!
          node scripts/fetch-committees.mjs &
          PID_COMMITTEES=$!

          # Wait for all to finish, fail if any fail
          FAILED=0
          wait $PID_MEMBERS || { echo "::error::fetch-members failed"; FAILED=1; }
          wait $PID_BILLS || { echo "::error::fetch-bills failed"; FAILED=1; }
          wait $PID_COMMITTEES || { echo "::error::fetch-committees failed"; FAILED=1; }
          exit $FAILED
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      # Phase 2: Votes + finances depend on members/bills/committees data
      - name: "Fetch votes and finances (parallel)"
        run: |
          node scripts/fetch-votes.mjs &
          PID_VOTES=$!
          node scripts/fetch-finances.mjs &
          PID_FINANCES=$!

          FAILED=0
          wait $PID_VOTES || { echo "::error::fetch-votes failed"; FAILED=1; }
          wait $PID_FINANCES || { echo "::error::fetch-finances failed"; FAILED=1; }
          exit $FAILED
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "chore: update congress data [$(date -u +%Y-%m-%d)]"
            git pull origin main --rebase
            git push origin main
          fi
