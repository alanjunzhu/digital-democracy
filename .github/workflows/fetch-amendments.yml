name: Fetch Amendments Data

on:
  schedule:
    - cron: '30 11 * * 2,5'  # Tuesday and Friday, half an hour after the votes run
  workflow_dispatch:

permissions:
  contents: write

# Data runs all push to main, so let them queue instead of racing.
concurrency:
  group: fetch-data
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-amendments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch amendments data
        run: node scripts/fetch-amendments.mjs
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts/commit-data.sh "chore: update amendments data [$(date -u +%Y-%m-%d)]" data/amendments/
